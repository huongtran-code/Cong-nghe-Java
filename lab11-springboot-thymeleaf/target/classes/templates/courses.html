<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Khóa học - Lab 11</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navigation Menu (Bài 7) -->
    <nav class="navbar">
        <div class="nav-container">
            <a th:href="@{/}" class="brand-logo">
                ⚡ <span>EAUT Java Tech</span>
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="nav-item"><a th:href="@{/about}">Giới thiệu</a></li>
                <li class="nav-item"><a th:href="@{/students}">Sinh viên</a></li>
                <li class="nav-item"><a th:href="@{/courses}" class="active">Khóa học</a></li>
                <li class="nav-item"><a th:href="@{/contact}">Liên hệ</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
        <div class="table-wrapper">
            <div class="table-header-bar">
                <div class="table-title">📚 Danh sách 5 Khóa học Mẫu</div>
                <div class="badge-count" th:text="${'Tổng số: ' + totalCourses + ' môn học'}">Tổng số: 5 môn học</div>
            </div>
            
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã Học phần</th>
                        <th>Tên Môn học</th>
                        <th>Số Tín chỉ</th>
                        <th>Loại Môn học</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c, stat : ${courses}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <strong style="color: var(--primary-color);" th:text="${c.courseCode}">IT3242</strong>
                        </td>
                        <td th:text="${c.courseName}">Công nghệ Java</td>
                        <td style="text-align: center;">
                            <span style="font-weight: 700;" th:text="${c.credits}">3</span>
                        </td>
                        <td>
                            <span th:class="${c.type == 'Bắt buộc' ? 'pill-tag pill-primary' : 'pill-tag pill-secondary'}" 
                                  th:text="${c.type}">Bắt buộc</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Học phần Công nghệ Java (IT3242) - Trường Đại học Công nghệ Đông Á</p>
    </footer>

</body>
</html>
