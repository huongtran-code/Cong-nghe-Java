<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold text-primary mb-4">Chi Tiết Sinh Viên</h3>

                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item d-flex justify-content-between"><strong>ID:</strong> <span
                            th:text="${student.id}"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Mã SV:</strong> <span
                            th:text="${student.studentCode}"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Họ và tên:</strong> <span
                            th:text="${student.fullName}"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Email:</strong> <span
                            th:text="${student.email}"></span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Lớp:</strong> <span
                            th:text="${student.className}"></span></li>
                </ul>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/students}" class="btn btn-secondary">Quay lại</a>
                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning">Chỉnh sửa</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
