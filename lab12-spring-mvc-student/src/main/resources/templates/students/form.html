<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold text-primary mb-4"
                    th:text="${student.id == null ? 'Thêm Mới Sinh Viên' : 'Cập Nhật Sinh Viên'}"></h3>

                <form th:action="@{/students/save}" th:object="${student}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mã sinh viên</label>
                        <input type="text" th:field="*{studentCode}" class="form-control"
                            th:classappend="${#fields.hasErrors('studentCode')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}"
                            th:errors="*{studentCode}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ tên</label>
                        <input type="text" th:field="*{fullName}" class="form-control"
                            th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control"
                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Lớp</label>
                        <input type="text" th:field="*{className}" class="form-control"
                            th:classappend="${#fields.hasErrors('className')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('className')}"
                            th:errors="*{className}"></div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
                        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
