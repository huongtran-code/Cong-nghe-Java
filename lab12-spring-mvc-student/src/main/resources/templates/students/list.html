<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title fw-bold text-primary mb-4">
                    <i class="fa-solid fa-user-graduate me-2"></i>Quản Lý Sinh Viên
                </h2>

                <div class="d-flex justify-content-between align-items-center mb-4 row g-3">
                    <div class="col-md-6">
                        <form th:action="@{/students}" method="get" class="d-flex gap-2">
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                                placeholder="Nhập họ tên cần tìm...">
                            <button type="submit" class="btn btn-outline-primary"><i
                                    class="fa-solid fa-magnifying-glass me-1"></i>Tìm</button>
                            <a th:href="@{/students}" class="btn btn-outline-secondary">Đặt lại</a>
                        </form>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <a th:href="@{/students/create}" class="btn btn-success fw-medium">
                            <i class="fa-solid fa-plus me-1"></i>Thêm mới sinh viên
                        </a>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Mã SV</th>
                                <th>Họ tên</th>
                                <th>Email</th>
                                <th>Lớp</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student : ${students}">
                                <td th:text="${student.id}" class="fw-bold text-muted"></td>
                                <td th:text="${student.studentCode}"></td>
                                <td th:text="${student.fullName}"></td>
                                <td th:text="${student.email}"></td>
                                <td><span class="badge bg-info text-dark" th:text="${student.className}"></span></td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-info text-white"
                                            title="Xem"><i class="fa-solid fa-eye"></i></a>
                                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning"
                                            title="Sửa"><i class="fa-solid fa-pen"></i></a>
                                        <a th:href="@{/students/delete/{id}(id=${student.id})}"
                                            onclick="return confirm('Bạn có chắc chắn muốn xóa?');"
                                            class="btn btn-danger" title="Xóa"><i class="fa-solid fa-trash"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="6" class="text-center text-muted py-4">Không tìm thấy sinh viên nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
